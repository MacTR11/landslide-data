name: Update live.json

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch seats and polls
        run: python3 fetch_live.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet live.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "Update live.json"
          git push
